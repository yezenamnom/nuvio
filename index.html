<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nuvio — فيديو بلا إعلانات</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nuvio">
  <meta name="theme-color" content="#0b1220">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=20261120042002">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.6/shaka-player.compiled.js" defer></script>
  <script src="player.js?v=20261120042002" defer></script>
  <script src="import.js?v=20261120042002" defer></script>
  <script src="app.js?v=20261120042002" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Nuvio — الرئيسية">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="28" fill="url(#lg)"/>
        <path d="M26 20l18 12-18 12z" fill="#fff"/>
      </svg>
      <span class="brand-name">Nuvio</span>
    </a>

    <form id="searchForm" class="search" role="search">
      <input id="q" type="search" name="q" placeholder="ابحث أو الصق رابط يوتيوب…" autocomplete="off" enterkeyhint="search">
      <button type="submit" aria-label="بحث">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </form>

    <nav class="top-nav" aria-label="مكتبتي">
      <a class="icon-btn" href="#/history" title="سجل المشاهدة" aria-label="سجل المشاهدة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      </a>
      <a class="icon-btn" href="#/likes" title="الإعجابات" aria-label="الإعجابات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v10H4V10h3zm2.5 10h7.3a2 2 0 0 0 2-1.6l1.4-6.6A2 2 0 0 0 18.2 9.5H14l.7-3.6A1.6 1.6 0 0 0 12 4.6L9.5 8.3V20z"/></svg>
      </a>
      <a class="icon-btn" href="#/favs" title="القائمة المفضلة" aria-label="القائمة المفضلة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-3.8-6.5 3.8v-16a1 1 0 0 1 1-1z"/></svg>
      </a>
    </nav>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main id="view"></main>

  <template id="cardTpl">
    <a class="card">
      <div class="thumb"><img loading="lazy" alt=""><span class="dur"></span></div>
      <div class="meta">
        <h3 class="title"></h3>
        <div class="sub"></div>
      </div>
    </a>
  </template>
</body>
</html>
