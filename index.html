<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Nuvio — فيديو بلا إعلانات</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nuvio">
  <meta name="theme-color" content="#0b1220">
  <script>try{var t=(JSON.parse(localStorage.getItem('nuvio:prefs')||'{}').theme)||'';if(t&&t!=='nuvio'){document.documentElement.dataset.theme=t;var L=t==='light'||(t==='ytui'&&matchMedia('(prefers-color-scheme: light)').matches);document.querySelector('meta[name=theme-color]').content=L?'#ffffff':'#0f0f0f';}}catch(e){}</script>
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://yt3.ggpht.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=20261120164101">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.6/shaka-player.compiled.js" defer></script>
  <script src="player.js?v=20261120164101" defer></script>
  <script src="more.js?v=20261120164101" defer></script>
  <script src="music.js?v=20261120164101" defer></script>
  <script src="app.js?v=20261120164101" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Nuvio — الرئيسية">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="28" fill="url(#lg)"/>
        <path d="M26 20l18 12-18 12z" fill="#fff"/>
      </svg>
      <span class="brand-name">Nuvio</span>
    </a>

    <form id="searchForm" class="search" role="search">
      <input id="q" type="search" name="q" placeholder="ابحث أو الصق رابط يوتيوب…" autocomplete="off" enterkeyhint="search">
      <button type="submit" aria-label="بحث">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </form>
    <button id="menuBtn" class="icon-btn" aria-label="القائمة">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main id="view"></main>

  <template id="cardTpl">
    <a class="card">
      <div class="thumb"><img loading="lazy" decoding="async" alt=""><span class="dur"></span></div>
      <div class="meta">
        <h3 class="title"></h3>
        <div class="sub"></div>
      </div>
    </a>
  </template>
</body>
</html>
